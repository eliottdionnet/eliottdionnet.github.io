<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T₂, T₂′ et le 180°</title>
<link rel="stylesheet" href="lib/style.css">
<style>
  #vox { height: 300px; }
  #pph { height: 138px; }
  #psig { height: 168px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
  .presets .lab { font-size: 12px; color: var(--ink2); margin-right: 2px; }
  .presets .btn.on { background: var(--wash); border-color: var(--accent); }
  .story {
    margin-top: 10px; padding: 9px 12px; border-radius: 10px;
    background: var(--wash); border: 1px solid var(--border);
    font-size: 13.5px; line-height: 1.5; color: var(--ink); min-height: 64px;
  }
  .story .step { display: inline-block; font-size: 11.5px; font-weight: 650; letter-spacing: .02em;
    color: var(--accent); text-transform: uppercase; margin-right: 6px; }
  .ro { margin-top: 4px; }
</style>
</head>
<body>
<div class="presets" id="pre"><span class="lab">Parcours guidé :</span></div>
<div class="controls" id="ctl1"></div>
<div class="controls" id="ctl2"></div>
<div class="grid2">
  <div class="card">
    <h4>Les spins du voxel, vus de dessus</h4>
    <div class="plot" id="vox"></div>
    <div class="legend" id="leg"></div>
  </div>
  <div class="card">
    <h4>Phase de chaque spin</h4>
    <div class="plot" id="pph"></div>
    <h4 style="margin-top:6px">Signal = longueur de la flèche noire</h4>
    <div class="plot" id="psig"></div>
    <div class="readout ro" id="ro"></div>
  </div>
</div>
<div class="story" id="story"></div>
<script src="lib/ui.js"></script>
<script src="lib/tissus.js"></script>
<script src="lib/mri.js"></script>
<script>
(function () {
  const NSIG = 1500, NDRAW = 13, DT = 0.1;   // spins pour le signal / affichés, pas (ms)
  const SUIVI = 9;                            // spin mis en couleur quand seules les secousses agissent
  const TAU = 1;                              // ms : durée d'une « secousse » (tirage du voisin)
  const FLIP_DUR = 1.3;                        // s réelles pour l'animation du 180°
  const P = { fixe: true, voisins: false, flip: true, T2p: 15, T2: 80, TE: 40, speed: 1 };
  let D, t = 0, flipAnim = null, done = false;

  // ------------------------------------------------------------ hasard reproductible
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ------------------------------------------------------------ simulation complète
  const tmax = () => 2 * P.TE;
  function simulate() {
    const n = Math.round(tmax() / DT), nf = Math.round(P.TE / 2 / DT);
    const w = P.fixe ? 1000 / (2 * Math.PI * P.T2p) : 0;          // Hz, 1/T2' = 2π·w
    const sig = MRI.offsets(NSIG, w, "lorentz");
    const qs = []; for (let i = 0; i < NDRAW; i++) qs.push(0.07 + 0.86 * i / (NDRAW - 1));
    const drw = qs.map((q) => (w > 0 ? w * Math.tan(Math.PI * (q - 0.5)) : 0));
    const sd = P.voisins ? Math.sqrt(2 / (P.T2 * TAU)) : 0;        // rad/ms, taux Δ²τ/2 = 1/T2
    const r = rng(12345);
    const gauss = () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());
    const kick = Math.round(TAU / DT);
    const run = (fs, keep) => {
      const ph = new Float64Array(fs.length), dw = new Float64Array(fs.length);
      const hist = keep ? fs.map(() => new Float32Array(n + 1)) : null;
      const sx = new Float32Array(n + 1), sy = new Float32Array(n + 1);
      const rec = (k) => {
        let x = 0, y = 0;
        for (let i = 0; i < fs.length; i++) { x += Math.cos(ph[i]); y += Math.sin(ph[i]); if (keep) hist[i][k] = ph[i]; }
        sx[k] = x / fs.length; sy[k] = y / fs.length;
      };
      rec(0);
      for (let k = 1; k <= n; k++) {
        if ((k - 1) % kick === 0) for (let i = 0; i < fs.length; i++) dw[i] = sd * gauss();
        for (let i = 0; i < fs.length; i++) ph[i] += (2 * Math.PI * fs[i] / 1000 + dw[i]) * DT;
        if (P.flip && k === nf) for (let i = 0; i < fs.length; i++) ph[i] = -ph[i];   // miroir : φ → −φ
        rec(k);
      }
      return { hist, sx, sy };
    };
    const S = run(sig, false), V = run(drw, true);
    let pm = Math.PI;
    V.hist.forEach((h) => { for (let k = 0; k <= n; k++) pm = Math.max(pm, Math.abs(h[k])); });
    return { n, nf, w, drw, S, V, pm: Math.min(pm * 1.08, 6 * Math.PI) };
  }
  const idx = (tt) => UI.clamp(Math.round(tt / DT), 0, D.n);
  const T2s = () => 1 / ((P.voisins ? 1 / P.T2 : 0) + (P.fixe ? 1 / P.T2p : 0));
  const amp = (k) => Math.hypot(D.S.sx[k], D.S.sy[k]);

  // ------------------------------------------------------------ contrôles
  const anim = new UI.Anim(step);
  const cFixe = UI.check("#ctl1", { label: "Champ fixe non homogène → T₂′", value: P.fixe, onChange: (v) => { P.fixe = v; rebuild(); } });
  const cVois = UI.check("#ctl1", { label: "Secousses des voisins → T₂", value: P.voisins, onChange: (v) => { P.voisins = v; rebuild(); } });
  const sFlip = UI.seg("#ctl1", { value: P.flip, options: [[false, "Sans 180°"], [true, "Avec 180° à TE/2"]], onChange: (v) => { P.flip = v; rebuild(); } });
  const bx = UI.el("div", { class: "row", style: "gap:6px;align-items:flex-end;flex:0 0 auto" });
  UI.$("#ctl1").appendChild(bx);
  UI.playButton(bx, anim);
  UI.button(bx, "↺", () => { anim.pause(); setT(0); }, "btn");
  UI.seg(bx, { value: 1, options: [[0.5, "×½"], [1, "×1"], [2, "×2"]], onChange: (v) => { P.speed = v; } });

  const sT = UI.slider("#ctl2", { label: "Temps", min: 0, max: tmax(), step: DT, value: 0, unit: "ms", fmt: (v) => UI.fmt(v, 1),
    onInput: (v) => { anim.pause(); flipAnim = null; t = v; done = false; redraw(); } });
  UI.slider("#ctl2", { label: "T₂′ (champ fixe)", min: 5, max: 80, step: 1, value: P.T2p, unit: "ms", fmt: (v) => UI.fmt(v, 0), onInput: (v) => { P.T2p = v; later(true); } });
  UI.slider("#ctl2", { label: "T₂ (voisins)", min: 20, max: 300, step: 5, value: P.T2, unit: "ms", fmt: (v) => UI.fmt(v, 0), onInput: (v) => { P.T2 = v; later(true); } });
  UI.slider("#ctl2", { label: "TE", min: 20, max: 80, step: 2, value: P.TE, unit: "ms", fmt: (v) => UI.fmt(v, 0), onInput: (v) => { P.TE = v; later(true); } });

  const PRESETS = [
    ["① Champ fixe seul, sans 180°", { fixe: true, voisins: false, flip: false }],
    ["② Champ fixe seul, avec 180°", { fixe: true, voisins: false, flip: true }],
    ["③ Voisins seuls, avec 180°", { fixe: false, voisins: true, flip: true }],
    ["④ Les deux, avec 180°", { fixe: true, voisins: true, flip: true }],
  ];
  const preBtns = PRESETS.map(([lab, o]) => UI.button("#pre", lab, () => {
    Object.assign(P, o); cFixe.set(o.fixe, true); cVois.set(o.voisins, true); sFlip.set(o.flip, true);
    rebuild(); anim.play();
  }, "btn"));

  let pending = null;
  const later = (keepT) => { clearTimeout(pending); pending = setTimeout(() => rebuild(keepT), 40); };

  function rebuild(keepT) {
    anim.pause(); flipAnim = null; done = false;
    D = simulate();
    const tm = tmax();
    sT.input.max = tm;
    if (!keepT) t = 0; else t = Math.min(t, tm);
    sT.set(t, true);
    preBtns.forEach((b, i) => {
      const o = PRESETS[i][1];
      b.classList.toggle("on", o.fixe === P.fixe && o.voisins === P.voisins && o.flip === P.flip);
    });
    legend();
    redraw();
  }
  function setT(v) { t = v; done = false; flipAnim = null; sT.set(t, true); redraw(); }

  function step(dt) {
    if (done) { done = false; t = 0; }
    if (flipAnim) {
      flipAnim.p += dt / FLIP_DUR;
      if (flipAnim.p >= 1) { flipAnim = null; t = P.TE / 2; sT.set(t, true); }
      redraw(); return;
    }
    if (t >= tmax() - 1e-9) { done = true; return false; }
    const tf = P.TE / 2;
    let nt = t + dt * P.speed * P.TE / 5;            // ~5 s réelles jusqu'à l'écho
    if (P.flip && t < tf && nt >= tf) { t = tf; flipAnim = { p: 0 }; sT.set(t, true); redraw(); return; }
    t = Math.min(nt, tmax());
    sT.set(t, true);
    redraw();
  }

  // ------------------------------------------------------------ couleurs
  function hex2rgb(h) { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  function mix(a, b, u) { return a.map((v, i) => Math.round(v + (b[i] - v) * u)); }
  function divColor(f) {
    const fm = Math.max(...D.drw.map(Math.abs));
    if (!(fm > 0)) return UI.css("--ink2");
    const u = UI.clamp(f / fm, -1, 1);
    const n = hex2rgb(UI.css("--neg")), m = hex2rgb(UI.css("--mid")), p = hex2rgb(UI.css("--pos"));
    return `rgb(${(u < 0 ? mix(m, n, -u) : mix(m, p, u)).join(",")})`;
  }

  // ------------------------------------------------------------ vue de dessus
  const cv = UI.canvas("#vox", drawVox);
  function drawVox(ctx, w, h) {
    const cx = w / 2, cy = h / 2 + 8, R = Math.min(w, h) * 0.4;
    const grid = UI.css("--grid"), axis = UI.css("--axis"), muted = UI.css("--muted");
    ctx.strokeStyle = grid; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = axis; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - R - 12, cy); ctx.lineTo(cx + R + 12, cy); ctx.stroke();
    ctx.strokeStyle = UI.css("--rf"); ctx.globalAlpha = P.flip ? 0.55 : 0.2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(cx, cy - R - 14); ctx.lineTo(cx, cy + R + 14); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    UI.text(ctx, "x", cx + R + 16, cy, { color: muted, size: 12, weight: "600" });
    UI.text(ctx, P.flip ? "y : axe du 180°" : "y", cx + 6, cy - R - 10, { color: P.flip ? UI.css("--rf") : muted, size: 11.5, weight: "600" });
    if (!flipAnim) UI.text(ctx, "départ", cx + 6, cy + R + 10, { color: muted, size: 11 });

    // état affiché : pendant le 180°, on replie l'état juste avant le miroir
    let k = idx(t), squeeze = 1;
    if (flipAnim) { k = D.nf - 1; squeeze = Math.cos(Math.PI * flipAnim.p); }
    const P2 = (ang, len) => [cx + squeeze * len * Math.cos(ang), cy - len * Math.sin(ang)];
    // angle écran : φ = 0 vers le bas (−y), φ > 0 vers la droite
    const ang = (ph) => -Math.PI / 2 + ph;
    D.drw.forEach((f, i) => {
      const p = P2(ang(D.V.hist[i][k]), R * 0.92);
      const suivi = !P.fixe && i === SUIVI;
      UI.arrow(ctx, cx, cy, p[0], p[1], suivi ? UI.css("--accent") : divColor(f), suivi ? 3 : 2, suivi ? 10 : 8);
    });
    const sx = D.S.sx[k], sy = D.S.sy[k], a = Math.hypot(sx, sy);
    if (a > 0.01) {
      const p = P2(Math.atan2(sy, sx) - Math.PI / 2, R * a);
      UI.arrow(ctx, cx, cy, p[0], p[1], UI.css("--m-sum"), 4, 12);
    }
    ctx.fillStyle = UI.css("--m-sum"); ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 2 * Math.PI); ctx.fill();
    UI.text(ctx, "t = " + UI.fmt(flipAnim ? P.TE / 2 : t, 1) + " ms", 8, 12, { color: UI.css("--ink"), size: 13, weight: "600" });
    if (flipAnim) UI.text(ctx, "180° autour de y : on retourne le plan", w / 2, h - 10, { align: "center", color: UI.css("--rf"), size: 12.5, weight: "650", halo: true });
  }
  function legend() {
    UI.$("#leg").innerHTML = P.fixe
      ? `<span><span class="sw" style="background:${UI.css("--neg")}"></span>champ un peu plus faible (plus lent)</span>` +
        `<span><span class="sw" style="background:${UI.css("--pos")}"></span>champ un peu plus fort (plus rapide)</span>` +
        `<span><span class="sw" style="background:${UI.css("--m-sum")}"></span>somme = signal</span>`
      : `<span><span class="sw" style="background:${UI.css("--ink2")}"></span>spins (même champ fixe)</span>` +
        `<span><span class="sw" style="background:${UI.css("--accent")}"></span>un spin suivi</span>` +
        `<span><span class="sw" style="background:${UI.css("--m-sum")}"></span>somme = signal</span>`;
  }

  // ------------------------------------------------------------ phases
  const cph = UI.canvas("#pph", drawPh);
  const pph = new UI.Plot(cph, { x: { min: 0, max: 80 }, y: { min: -1, max: 1 }, pad: { l: 46, r: 14, t: 8, b: 18 } });
  function piFmt(v) {
    const k = Math.round(v / Math.PI);
    return k === 0 ? "0" : (k < 0 ? "−" : "") + (Math.abs(k) === 1 ? "" : Math.abs(k)) + "π";
  }
  function drawPh(ctx, w, h) {
    const lo = -D.pm, hi = D.pm, st = hi > 3 * Math.PI ? 2 * Math.PI : Math.PI;
    const ticks = []; for (let v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) ticks.push(v);
    pph.x = { min: 0, max: tmax(), fmt: () => "" };
    pph.y = { min: lo, max: hi, ticks, fmt: piFmt };
    pph.frame(ctx, w, h);
    if (P.flip) pph.vline(P.TE / 2, { color: UI.css("--rf"), dash: [2, 3], width: 1.2, label: "180°", labelColor: UI.css("--rf") });
    pph.vline(P.TE, { color: UI.css("--muted"), dash: [4, 4], width: 1, label: "TE", labelLeft: true });
    const k = flipAnim ? D.nf - 1 : idx(t), xs = [];
    for (let j = 0; j <= k; j++) xs.push(j * DT);
    D.drw.forEach((f, i) => { if (P.fixe || i !== SUIVI) pph.line(xs, Array.from(D.V.hist[i].subarray(0, k + 1)), { color: divColor(f), width: 1.5, alpha: P.fixe ? 1 : 0.55 }); });
    if (!P.fixe) pph.line(xs, Array.from(D.V.hist[SUIVI].subarray(0, k + 1)), { color: UI.css("--accent"), width: 2.6 });
  }

  // ------------------------------------------------------------ signal
  const csig = UI.canvas("#psig", drawSig);
  const psig = new UI.Plot(csig, { x: { min: 0, max: 80, label: "t (ms)" }, y: { min: 0, max: 1.08, ticks: [0, 0.5, 1] }, pad: { l: 46, r: 14, t: 8, b: 34 } });
  function drawSig(ctx, w, h) {
    psig.x = { min: 0, max: tmax(), label: "t (ms)" };
    psig.frame(ctx, w, h);
    const mut = UI.css("--muted");
    if (P.voisins) psig.func((x) => Math.exp(-x / P.T2), { color: mut, width: 1.3, dash: [6, 4] });
    if (P.fixe || P.voisins) psig.func((x) => Math.exp(-x / T2s()), { color: UI.css("--c-violet"), width: 1.3, dash: [1.5, 3] });
    if (P.flip) psig.vline(P.TE / 2, { color: UI.css("--rf"), dash: [2, 3], width: 1.2 });
    psig.vline(P.TE, { color: mut, dash: [4, 4], width: 1 });
    const k = flipAnim ? D.nf - 1 : idx(t), xs = [], ys = [];
    for (let j = 0; j <= k; j++) { xs.push(j * DT); ys.push(amp(j)); }
    psig.line(xs, ys, { color: UI.css("--m-sum"), width: 2.2 });
    psig.dot(k * DT, amp(k), { color: UI.css("--m-sum"), r: 4 });
    const xl = tmax() * 0.99;
    if (P.voisins) psig.label(xl, Math.exp(-xl / P.T2), "T₂ seul", { align: "right", dy: -9, color: UI.css("--ink2") });
    if (P.fixe || P.voisins) {
      const tl = Math.min(tmax() * 0.6, 1.3 * T2s());
      psig.label(tl, Math.exp(-tl / T2s()), "T₂*", { align: "left", dx: 5, dy: -8, color: UI.css("--c-violet") });
    }
  }

  // ------------------------------------------------------------ récit
  function story() {
    const tf = P.TE / 2, te = P.TE, f2 = (x) => UI.fmt(x, 2);
    const eT2 = Math.exp(-te / P.T2), eT2s = Math.exp(-te / T2s());
    let tag, txt;
    if (!P.fixe && !P.voisins) {
      tag = "Rien ne bouge";
      txt = "Aucune cause de désalignement n'est active : les spins restent ensemble et le signal reste à 100 %. Cochez une des deux causes.";
    } else if (flipAnim || (P.flip && Math.abs(t - tf) < 0.15)) {
      tag = "Impulsion 180°";
      txt = `À TE/2 = ${UI.fmt(tf, 0)} ms, on retourne tout le plan autour de l'axe y, comme une crêpe. Un spin qui avait pris de l'avance se retrouve en retard du même angle, et inversement.`;
    } else if (t < tf || !P.flip && t < te - 0.6) {
      tag = "Les spins se désalignent";
      if (P.fixe && !P.voisins) txt = "Le champ n'est pas le même partout dans le voxel. Les spins rouges tournent un peu plus vite, les bleus un peu moins vite, et chacun garde sa vitesse. L'éventail s'ouvre de façon régulière et la flèche noire raccourcit.";
      else if (!P.fixe) txt = "Chaque spin est secoué au hasard par son voisin. Sa phase avance et recule sans logique : c'est une marche aléatoire. Le signal baisse plus lentement, mais il baisse.";
      else txt = "Les deux causes agissent ensemble : un éventail régulier dû au champ fixe, plus des secousses aléatoires dues aux voisins.";
      if (!P.flip) txt += " Sans 180°, rien ne viendra remettre les spins ensemble.";
    } else if (P.flip && t < te - 0.6) {
      tag = "Après le 180°";
      if (P.fixe && !P.voisins) txt = "Chaque spin garde sa vitesse. Le rouge, maintenant en retard, regagne exactement ce qu'il avait pris. Le bleu, maintenant en avance, se fait rattraper. L'éventail se referme.";
      else if (!P.fixe) txt = "Les secousses continuent, mais ce sont de nouveaux tirages au hasard. Elles n'ont aucune raison de compenser celles d'avant : rien ne se referme.";
      else txt = "La partie régulière de l'éventail se referme. Les secousses, elles, continuent au hasard et ne se compensent pas.";
    } else if (t <= te + 3) {
      tag = P.flip ? "Écho à TE" : "Temps TE";
      if (!P.flip) txt = `Sans 180°, rien n'a remis les spins en phase. Le signal à TE vaut e<sup>−TE/T₂*</sup> = ${f2(eT2s)}. C'est le signal d'un écho de gradient.`;
      else if (P.fixe && !P.voisins) txt = "Tous les spins sont de nouveau alignés : le signal revient à 100 %. Le déphasage dû au champ fixe (T₂′) a été entièrement annulé.";
      else if (!P.fixe) txt = `Le signal vaut e<sup>−TE/T₂</sup> = ${f2(eT2)}, exactement comme sans 180°. Le 180° ne peut rien contre T₂.`;
      else txt = `Le signal remonte à e<sup>−TE/T₂</sup> = ${f2(eT2)} au lieu de e<sup>−TE/T₂*</sup> = ${f2(eT2s)}. Le 180° a annulé la part T₂′, il ne reste que la part T₂. C'est un écho de spin.`;
    } else {
      tag = "Après TE";
      txt = P.flip ? "Après l'écho, les spins se désalignent de nouveau. Un deuxième 180° permettrait un deuxième écho." : "Le signal continue de décroître avec la constante T₂*.";
    }
    UI.$("#story").innerHTML = `<span class="step">${tag}</span>${txt}`;
  }
  function readout() {
    const parts = [];
    if (P.fixe) parts.push(`T₂′ = ${UI.fmt(P.T2p, 0)} ms`);
    if (P.voisins) parts.push(`T₂ = ${UI.fmt(P.T2, 0)} ms`);
    if (P.fixe || P.voisins) parts.push(`T₂* = ${UI.fmt(T2s(), 1)} ms` + (P.fixe && P.voisins ? " (1/T₂* = 1/T₂ + 1/T₂′)" : ""));
    const k = flipAnim ? D.nf - 1 : idx(t);
    parts.push(`signal = ${UI.fmt(amp(k), 2)}`);
    UI.$("#ro").innerHTML = parts.join(" · ");
  }

  function redraw() { cv.redraw(); cph.redraw(); csig.redraw(); story(); readout(); }
  UI.onTheme(legend);
  rebuild();
  // pour les captures statiques
  window.__etat = (o, tt) => { Object.assign(P, o); cFixe.set(P.fixe, true); cVois.set(P.voisins, true); sFlip.set(P.flip, true); rebuild(); setT(tt); };
})();
</script>
</body>
</html>
